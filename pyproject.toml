[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS: asistente personal con IA basado en el SDK de Anthropic."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "python-dotenv>=1.2.4",
    "truststore>=0.10",
    "tzdata>=2026.6",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
# Notas de voz: transcripción local con Whisper. Pesada, así que es un grupo aparte: `uv sync`
# lo instala por defecto y la CI lo omite (`--no-group voz`); sin él, JARVIS funciona sin voz.
voz = [
    "faster-whisper>=1.2.0",
    "av<19",  # faster-whisper 1.2 usa una opción de av.open que la v19 retiró
]

[tool.uv]
default-groups = ["dev", "voz"]
