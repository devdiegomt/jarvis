[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS: asistente personal con IA basado en el SDK de Anthropic."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "python-dotenv>=1.2.4",
    "truststore>=0.10",
    "tzdata>=2026.6",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "numpy>=2.0",  # los tests de la voz del PC generan audio de prueba (en la CI no se instala `voz`)
]
# Voz: transcripción local con Whisper y respuestas con Piper. Pesada, así que es un grupo aparte:
# `uv sync` lo instala por defecto y la CI lo omite (`--no-group voz`); sin él, JARVIS funciona sin voz.
voz = [
    "faster-whisper>=1.2.0",
    "av<19",  # faster-whisper 1.2 usa una opción de av.open que la v19 retiró
    "piper-tts>=1.3.0",
    "openwakeword==0.6.0",
    "sounddevice>=0.5.0",
]

[tool.uv]
default-groups = ["dev", "voz"]

# openWakeWord 0.6.0 pide tflite-runtime en Linux, que no existe para Python 3.12. JARVIS usa su
# motor ONNX (onnxruntime), así que se declaran sus dependencias sin tflite-runtime.
[[tool.uv.dependency-metadata]]
name = "openwakeword"
version = "0.6.0"
requires-dist = ["onnxruntime>=1.10.0,<2", "tqdm>=4.0,<5.0", "scipy>=1.3,<2", "scikit-learn>=1,<2", "requests>=2.0,<3"]
